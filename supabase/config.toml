# Supabase project configuration for the shopfront demo store.
#
# These functions are called by anonymous guest customers, so JWT verification
# is disabled. Access control is enforced inside each function via the
# service-role key plus the per-order capability token.

project_id = "amazon-product-iphone"

[functions.create-order]
verify_jwt = false

[functions.get-order]
verify_jwt = false

[functions.confirm-demo-payment]
verify_jwt = false
