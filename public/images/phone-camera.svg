<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="900" height="700" role="img" aria-labelledby="t d">
  <title id="t">48MP Pro Fusion camera system</title>
  <desc id="d">Close-up of the triple 48MP Fusion camera array with tetraprism telephoto.</desc>
  <defs>
    <linearGradient id="plateau" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#f0a871" />
      <stop offset="0.5" stop-color="#cf7130" />
      <stop offset="1" stop-color="#9a4612" />
    </linearGradient>
    <linearGradient id="plateauSheen" x1="0" y1="0" x2="1" y2="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.04" />
      <stop offset="1" stop-color="#3d1601" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="barrel" cx="0.34" cy="0.28" r="0.82">
      <stop offset="0" stop-color="#fbd6b2" />
      <stop offset="0.4" stop-color="#c4702c" />
      <stop offset="0.75" stop-color="#8a3c0b" />
      <stop offset="1" stop-color="#5a2405" />
    </radialGradient>
    <radialGradient id="glass" cx="0.36" cy="0.3" r="0.76">
      <stop offset="0" stop-color="#8fa6c4" />
      <stop offset="0.16" stop-color="#3d4757" />
      <stop offset="0.42" stop-color="#141a22" />
      <stop offset="0.78" stop-color="#080b10" />
      <stop offset="1" stop-color="#04060a" />
    </radialGradient>
    <radialGradient id="iris" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#1d2733" />
      <stop offset="0.6" stop-color="#0a0e13" />
      <stop offset="1" stop-color="#05070b" />
    </radialGradient>
    <radialGradient id="flash" cx="0.4" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#fffdf6" />
      <stop offset="0.5" stop-color="#efdcc0" />
      <stop offset="1" stop-color="#ab8d68" />
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="11" result="n" />
      <feColorMatrix type="saturate" values="0" in="n" result="ng" />
      <feComponentTransfer in="ng" result="na">
        <feFuncA type="linear" slope="0.05" intercept="0" />
      </feComponentTransfer>
      <feComposite operator="over" in="na" in2="SourceGraphic" />
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#2b1204" flood-opacity="0.35" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="150" y="60" width="600" height="600" rx="150" ry="150" fill="#5e2405" opacity="0.2" />
    <rect x="140" y="48" width="600" height="600" rx="150" ry="150" fill="url(#plateau)" />
    <rect x="140" y="48" width="600" height="600" rx="150" ry="150" fill="url(#plateauSheen)" />
    <rect x="140" y="48" width="600" height="600" rx="150" ry="150" fill="#ffffff" filter="url(#grain)" opacity="0.85" />
    <rect
      x="141.5"
      y="49.5"
      width="597"
      height="597"
      rx="148.5"
      ry="148.5"
      fill="none"
      stroke="#ffd0a4"
      stroke-opacity="0.4"
      stroke-width="3"
    />

    <!-- lens assemblies -->
    <g transform="translate(0,0)">
      <circle cx="300" cy="248" r="112" fill="#3d1601" opacity="0.5" />
      <circle cx="300" cy="238" r="112" fill="url(#barrel)" />
      <circle cx="300" cy="238" r="86" fill="#100b07" />
      <circle cx="300" cy="238" r="80" fill="url(#glass)" />
      <circle cx="300" cy="238" r="40" fill="url(#iris)" />
      <circle cx="300" cy="238" r="18" fill="#05070a" />
      <ellipse cx="266" cy="202" rx="26" ry="15" fill="#dbe8fa" opacity="0.42" transform="rotate(-32 266 202)" />
      <ellipse cx="338" cy="286" rx="12" ry="7" fill="#9fb6d1" opacity="0.3" transform="rotate(-32 338 286)" />
      <circle cx="300" cy="238" r="80" fill="none" stroke="#c9b191" stroke-opacity="0.35" stroke-width="2" />
    </g>

    <g transform="translate(0,0)">
      <circle cx="300" cy="470" r="112" fill="#3d1601" opacity="0.5" />
      <circle cx="300" cy="460" r="112" fill="url(#barrel)" />
      <circle cx="300" cy="460" r="86" fill="#100b07" />
      <circle cx="300" cy="460" r="80" fill="url(#glass)" />
      <circle cx="300" cy="460" r="40" fill="url(#iris)" />
      <circle cx="300" cy="460" r="18" fill="#05070a" />
      <ellipse cx="266" cy="424" rx="26" ry="15" fill="#dbe8fa" opacity="0.42" transform="rotate(-32 266 424)" />
      <ellipse cx="338" cy="508" rx="12" ry="7" fill="#9fb6d1" opacity="0.3" transform="rotate(-32 338 508)" />
      <circle cx="300" cy="460" r="80" fill="none" stroke="#c9b191" stroke-opacity="0.35" stroke-width="2" />
    </g>

    <g transform="translate(0,0)">
      <circle cx="552" cy="354" r="112" fill="#3d1601" opacity="0.5" />
      <circle cx="552" cy="344" r="112" fill="url(#barrel)" />
      <circle cx="552" cy="344" r="86" fill="#100b07" />
      <circle cx="552" cy="344" r="80" fill="url(#glass)" />
      <circle cx="552" cy="344" r="40" fill="url(#iris)" />
      <circle cx="552" cy="344" r="18" fill="#05070a" />
      <ellipse cx="518" cy="308" rx="26" ry="15" fill="#dbe8fa" opacity="0.42" transform="rotate(-32 518 308)" />
      <ellipse cx="590" cy="392" rx="12" ry="7" fill="#9fb6d1" opacity="0.3" transform="rotate(-32 590 392)" />
      <circle cx="552" cy="344" r="80" fill="none" stroke="#c9b191" stroke-opacity="0.35" stroke-width="2" />
    </g>

    <!-- True Tone flash -->
    <g transform="translate(0,0)">
      <circle cx="470" cy="152" r="34" fill="#3d1601" opacity="0.45" />
      <circle cx="470" cy="146" r="34" fill="url(#flash)" />
      <circle cx="470" cy="146" r="17" fill="#fffdf7" />
    </g>
    <!-- LiDAR -->
    <g transform="translate(0,0)">
      <circle cx="566" cy="146" r="34" fill="#3d1601" opacity="0.45" />
      <circle cx="566" cy="140" r="34" fill="#1a1f28" />
      <circle cx="566" cy="140" r="17" fill="#0a0e13" />
      <circle cx="558" cy="132" r="7" fill="#9fb6d1" opacity="0.55" />
    </g>
  </g>
</svg>