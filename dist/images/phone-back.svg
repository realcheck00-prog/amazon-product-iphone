<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820" role="img" aria-labelledby="t d">
  <title id="t">iPhone 17 Pro Max, Cosmic Orange — back view</title>
  <desc id="d">Aluminium unibody back in Cosmic Orange with the 48MP Pro Fusion camera plateau.</desc>
  <defs>
    <linearGradient id="backBody" x1="0.08" y1="0" x2="0.95" y2="1">
      <stop offset="0" stop-color="#e69355" />
      <stop offset="0.32" stop-color="#d0712e" />
      <stop offset="0.68" stop-color="#b85a20" />
      <stop offset="1" stop-color="#96430f" />
    </linearGradient>
    <linearGradient id="edgeLit" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#ffd9b4" stop-opacity="0.95" />
      <stop offset="0.06" stop-color="#f0a066" stop-opacity="0.25" />
      <stop offset="0.5" stop-color="#7d3607" stop-opacity="0.18" />
      <stop offset="0.94" stop-color="#ffd0a4" stop-opacity="0.35" />
      <stop offset="1" stop-color="#8b3d0c" stop-opacity="0.6" />
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="0.28" stop-color="#ffffff" stop-opacity="0.06" />
      <stop offset="0.62" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="1" stop-color="#3d1601" stop-opacity="0.22" />
    </linearGradient>
    <linearGradient id="plateau" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#e79a5c" />
      <stop offset="0.55" stop-color="#c16524" />
      <stop offset="1" stop-color="#a04a15" />
    </linearGradient>
    <radialGradient id="lensGlass" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#6f7f96" />
      <stop offset="0.28" stop-color="#2b3340" />
      <stop offset="0.62" stop-color="#0d1117" />
      <stop offset="1" stop-color="#05070a" />
    </radialGradient>
    <radialGradient id="lensRing" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#f4cba6" />
      <stop offset="0.5" stop-color="#a9551d" />
      <stop offset="1" stop-color="#6d2f08" />
    </radialGradient>
    <radialGradient id="flash" cx="0.4" cy="0.34" r="0.7">
      <stop offset="0" stop-color="#fff8ec" />
      <stop offset="0.55" stop-color="#f0dcbe" />
      <stop offset="1" stop-color="#b79a75" />
    </radialGradient>
    <radialGradient id="lidar" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#5d6d84" />
      <stop offset="0.6" stop-color="#1a1f28" />
      <stop offset="1" stop-color="#080b10" />
    </radialGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="7" result="n" />
      <feColorMatrix type="saturate" values="0" in="n" result="ng" />
      <feComponentTransfer in="ng" result="na">
        <feFuncA type="linear" slope="0.055" intercept="0" />
      </feComponentTransfer>
      <feComposite operator="over" in="na" in2="SourceGraphic" />
    </filter>
    <filter id="softShadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2b1204" flood-opacity="0.34" />
    </filter>
    <clipPath id="bodyClip">
      <rect x="16" y="10" width="368" height="800" rx="62" ry="62" />
    </clipPath>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="16" y="10" width="368" height="800" rx="62" ry="62" fill="url(#edgeLit)" />
    <g clip-path="url(#bodyClip)">
      <rect x="20" y="13" width="360" height="794" rx="60" ry="60" fill="url(#backBody)" />
      <rect x="20" y="13" width="360" height="794" rx="60" ry="60" fill="url(#sheen)" />
      <rect x="20" y="13" width="360" height="794" rx="60" ry="60" fill="#ffffff" filter="url(#grain)" opacity="0.9" />
      <!-- soft diagonal studio reflection -->
      <path d="M20 250 L200 13 L318 13 L20 420 Z" fill="#ffffff" opacity="0.09" />
      <path d="M380 470 L380 807 L236 807 Z" fill="#2f1103" opacity="0.13" />

      <!-- Camera plateau -->
      <rect x="46" y="40" width="176" height="176" rx="46" ry="46" fill="#5e2405" opacity="0.28" />
      <rect x="44" y="36" width="176" height="176" rx="46" ry="46" fill="url(#plateau)" />
      <rect
        x="44"
        y="36"
        width="176"
        height="176"
        rx="46"
        ry="46"
        fill="none"
        stroke="#ffd0a4"
        stroke-opacity="0.4"
        stroke-width="1.2"
      />

      <!-- 48MP Fusion Telephoto (top-left) -->
      <g>
        <circle cx="98" cy="90" r="33" fill="#3d1601" opacity="0.55" />
        <circle cx="98" cy="88" r="33" fill="url(#lensRing)" />
        <circle cx="98" cy="88" r="25.5" fill="#120c07" />
        <circle cx="98" cy="88" r="23" fill="url(#lensGlass)" />
        <circle cx="90" cy="80" r="6" fill="#cfe0f5" opacity="0.5" />
        <circle cx="105" cy="97" r="3" fill="#8fa8c6" opacity="0.35" />
      </g>

      <!-- 48MP Fusion Ultra Wide (bottom-left) -->
      <g>
        <circle cx="98" cy="158" r="33" fill="#3d1601" opacity="0.55" />
        <circle cx="98" cy="156" r="33" fill="url(#lensRing)" />
        <circle cx="98" cy="156" r="25.5" fill="#120c07" />
        <circle cx="98" cy="156" r="23" fill="url(#lensGlass)" />
        <circle cx="90" cy="148" r="6" fill="#cfe0f5" opacity="0.5" />
        <circle cx="105" cy="165" r="3" fill="#8fa8c6" opacity="0.35" />
      </g>

      <!-- 48MP Fusion Main (right) -->
      <g>
        <circle cx="168" cy="124" r="33" fill="#3d1601" opacity="0.55" />
        <circle cx="168" cy="122" r="33" fill="url(#lensRing)" />
        <circle cx="168" cy="122" r="25.5" fill="#120c07" />
        <circle cx="168" cy="122" r="23" fill="url(#lensGlass)" />
        <circle cx="160" cy="114" r="6" fill="#cfe0f5" opacity="0.5" />
        <circle cx="175" cy="131" r="3" fill="#8fa8c6" opacity="0.35" />
      </g>

      <!-- True Tone flash + LiDAR -->
      <g>
        <circle cx="150" cy="60" r="9.5" fill="#3d1601" opacity="0.5" />
        <circle cx="150" cy="58" r="9.5" fill="url(#flash)" />
        <circle cx="150" cy="58" r="4.5" fill="#fffdf7" />
      </g>
      <g>
        <circle cx="178" cy="58" r="9.5" fill="#3d1601" opacity="0.5" />
        <circle cx="178" cy="56" r="9.5" fill="url(#lidar)" />
        <circle cx="175" cy="53" r="2.4" fill="#9fb6d1" opacity="0.6" />
      </g>

      <!-- Ceramic Shield wordmark -->
      <g opacity="0.5">
        <rect x="46" y="742" width="86" height="1.4" fill="#ffe2c4" />
        <text
          x="46"
          y="762"
          font-family="Inter Variable, Inter, Helvetica, Arial, sans-serif"
          font-size="13"
          letter-spacing="3.4"
          fill="#ffeedd"
        >
          iPhone
        </text>
      </g>
    </g>
    <rect
      x="16.9"
      y="10.9"
      width="366.2"
      height="798.2"
      rx="61"
      ry="61"
      fill="none"
      stroke="#ffffff"
      stroke-opacity="0.45"
      stroke-width="1.8"
    />
  </g>
</svg>