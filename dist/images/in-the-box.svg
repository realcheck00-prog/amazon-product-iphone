<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620" role="img" aria-labelledby="t d">
  <title id="t">In the box</title>
  <desc id="d">iPhone 17 Pro Max with iOS 26, USB-C Charge Cable (1 m) and documentation.</desc>
  <defs>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#eda268" />
      <stop offset="0.4" stop-color="#cf7130" />
      <stop offset="1" stop-color="#96430f" />
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd9b4" />
      <stop offset="0.5" stop-color="#d8873f" />
      <stop offset="1" stop-color="#8b3d0c" />
    </linearGradient>
    <linearGradient id="plateau" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#e9a065" />
      <stop offset="0.6" stop-color="#c16524" />
      <stop offset="1" stop-color="#9c4714" />
    </linearGradient>
    <radialGradient id="lensRing" cx="0.35" cy="0.28" r="0.8">
      <stop offset="0" stop-color="#f4cba6" />
      <stop offset="0.5" stop-color="#a9551d" />
      <stop offset="1" stop-color="#6d2f08" />
    </radialGradient>
    <radialGradient id="lensGlass" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#6f7f96" />
      <stop offset="0.3" stop-color="#2b3340" />
      <stop offset="0.64" stop-color="#0d1117" />
      <stop offset="1" stop-color="#05070a" />
    </radialGradient>
    <linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2f4" />
      <stop offset="0.5" stop-color="#d5d7dc" />
      <stop offset="1" stop-color="#a9adb6" />
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="190%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#2b1204" flood-opacity="0.3" />
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#fafafa" />

  <!-- phone, flat lay -->
  <g transform="translate(120 60) rotate(-6 160 250)">
    <g filter="url(#softShadow)">
      <rect x="0" y="0" width="320" height="500" rx="46" ry="46" fill="url(#rail)" />
      <rect x="4" y="3.5" width="312" height="493" rx="43" ry="43" fill="url(#body)" />
      <rect x="30" y="26" width="140" height="140" rx="38" ry="38" fill="url(#plateau)" />
      <circle cx="72" cy="68" r="24" fill="url(#lensRing)" />
      <circle cx="72" cy="68" r="16" fill="url(#lensGlass)" />
      <circle cx="72" cy="122" r="24" fill="url(#lensRing)" />
      <circle cx="72" cy="122" r="16" fill="url(#lensGlass)" />
      <circle cx="128" cy="95" r="24" fill="url(#lensRing)" />
      <circle cx="128" cy="95" r="16" fill="url(#lensGlass)" />
      <circle cx="116" cy="46" r="7" fill="#fff8ec" />
      <circle cx="140" cy="46" r="7" fill="#161c25" />
      <text
        x="30"
        y="462"
        font-family="Inter Variable, Inter, Helvetica, Arial, sans-serif"
        font-size="15"
        letter-spacing="4"
        fill="#ffeedd"
        opacity="0.55"
      >
        iPhone
      </text>
      <rect
        x="0.9"
        y="0.9"
        width="318.2"
        height="498.2"
        rx="45.1"
        ry="45.1"
        fill="none"
        stroke="#ffe6cd"
        stroke-opacity="0.5"
        stroke-width="1.8"
      />
    </g>
  </g>

  <!-- USB-C charge cable, coiled -->
  <g transform="translate(500 150)">
    <g filter="url(#softShadow)">
      <ellipse cx="150" cy="180" rx="140" ry="112" fill="none" stroke="url(#cable)" stroke-width="15" />
      <ellipse cx="150" cy="180" rx="140" ry="112" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" />
      <ellipse cx="150" cy="180" rx="66" ry="52" fill="none" stroke="url(#cable)" stroke-width="15" />
      <ellipse cx="150" cy="180" rx="66" ry="52" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="4" />
      <!-- USB-C connector -->
      <g transform="translate(232 132)">
        <rect x="0" y="0" width="76" height="46" rx="12" fill="#e8eaee" stroke="#b9bdc6" stroke-width="2" />
        <rect x="60" y="13" width="26" height="20" rx="9" fill="#cfd3da" stroke="#a9adb6" stroke-width="2" />
        <rect x="76" y="18" width="14" height="10" rx="4" fill="#8f949e" />
      </g>
      <g transform="translate(24 30)">
        <rect x="0" y="0" width="76" height="46" rx="12" fill="#e8eaee" stroke="#b9bdc6" stroke-width="2" />
        <rect x="60" y="13" width="26" height="20" rx="9" fill="#cfd3da" stroke="#a9adb6" stroke-width="2" />
        <rect x="76" y="18" width="14" height="10" rx="4" fill="#8f949e" />
      </g>
    </g>
  </g>

  <!-- documentation -->
  <g transform="translate(520 420) rotate(4)" filter="url(#softShadow)">
    <rect x="0" y="0" width="210" height="140" rx="6" fill="#ffffff" stroke="#d5d9d9" stroke-width="2" />
    <rect x="16" y="18" width="110" height="9" rx="4.5" fill="#d5d9d9" />
    <rect x="16" y="38" width="170" height="6" rx="3" fill="#e7e7e7" />
    <rect x="16" y="52" width="150" height="6" rx="3" fill="#e7e7e7" />
    <rect x="16" y="66" width="164" height="6" rx="3" fill="#e7e7e7" />
    <rect x="16" y="88" width="60" height="6" rx="3" fill="#d5d9d9" />
    <rect x="150" y="84" width="44" height="20" rx="4" fill="#f3f3f3" />
  </g>
</svg>