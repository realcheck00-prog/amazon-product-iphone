<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 820" width="400" height="820" role="img" aria-labelledby="t d">
  <title id="t">iPhone 17 Pro Max, Cosmic Orange — side profile</title>
  <desc id="d">Aluminium unibody edge showing the Action button, volume controls and power button.</desc>
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7a3407" />
      <stop offset="0.16" stop-color="#c96a2c" />
      <stop offset="0.38" stop-color="#f0a066" />
      <stop offset="0.6" stop-color="#cf7130" />
      <stop offset="0.84" stop-color="#95420e" />
      <stop offset="1" stop-color="#6b2d05" />
    </linearGradient>
    <linearGradient id="railGloss" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="1" stop-color="#2a1002" stop-opacity="0.4" />
    </linearGradient>
    <filter id="softShadow" x="-60%" y="-20%" width="220%" height="150%">
      <feDropShadow dx="6" dy="14" stdDeviation="16" flood-color="#2b1204" flood-opacity="0.34" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <rect x="132" y="10" width="136" height="800" rx="62" ry="62" fill="url(#rail)" />
    <rect x="132" y="10" width="136" height="800" rx="62" ry="62" fill="url(#railGloss)" />
    <!-- antenna split lines -->
    <rect x="132" y="196" width="136" height="4" fill="#4d1e02" opacity="0.35" />
    <rect x="132" y="620" width="136" height="4" fill="#4d1e02" opacity="0.35" />
    <!-- Action button -->
    <rect x="126" y="196" width="12" height="34" rx="6" fill="#8c3d0b" />
    <rect x="126" y="196" width="12" height="34" rx="6" fill="url(#railGloss)" opacity="0.7" />
    <!-- Volume up / down -->
    <rect x="126" y="266" width="12" height="62" rx="6" fill="#8c3d0b" />
    <rect x="126" y="342" width="12" height="62" rx="6" fill="#8c3d0b" />
    <rect x="126" y="266" width="12" height="62" rx="6" fill="url(#railGloss)" opacity="0.7" />
    <rect x="126" y="342" width="12" height="62" rx="6" fill="url(#railGloss)" opacity="0.7" />
    <!-- Power / side button -->
    <rect x="262" y="272" width="12" height="106" rx="6" fill="#8c3d0b" />
    <rect x="262" y="272" width="12" height="106" rx="6" fill="url(#railGloss)" opacity="0.7" />
    <!-- Camera plateau bleed on the rail -->
    <rect x="132" y="36" width="26" height="176" rx="22" fill="#a9541a" opacity="0.85" />
    <rect x="132" y="36" width="26" height="176" rx="22" fill="url(#railGloss)" />
    <rect
      x="132.8"
      y="10.8"
      width="134.4"
      height="798.4"
      rx="61.2"
      ry="61.2"
      fill="none"
      stroke="#ffe6cd"
      stroke-opacity="0.5"
      stroke-width="1.6"
    />
  </g>
</svg>